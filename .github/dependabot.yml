version: 2
updates:
  # Python deps for the production backend.
  - package-ecosystem: pip
    directory: /production/backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      backend:
        patterns: ["*"]
        # Group only non-breaking bumps. Majors come as separate PRs so one
        # incompatible upgrade can't block the whole batch.
        update-types: ["minor", "patch"]

  # npm deps for the production frontend.
  - package-ecosystem: npm
    directory: /production/frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # TypeScript 6 breaks openapi-typescript + @typescript-eslint peers
      # (they require ^5.x). Hold the major until the ecosystem catches up.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Keep the GitHub Actions themselves up to date.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
