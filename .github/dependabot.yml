version: 2
updates:
  # Python dependencies, read from pyproject.toml and uv.lock.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Wait before proposing a bump. Without this, Dependabot opens a pull request
    # the moment a version is published, including one published from a
    # compromised maintainer account. A week is usually long enough for a
    # malicious release to be yanked before it ever reaches a branch here.
    cooldown:
      default-days: 7
      semver-major-days: 30
    commit-message:
      prefix: "build"
      include: scope
    groups:
      # Minor and patch bumps travel together: one incompatible upgrade should not
      # block the rest. A major comes as its own pull request, because a major in
      # pydantic or cryptography needs the audit output checked against a fixture.
      dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # The pinned hook revisions in .pre-commit-config.yaml. The ruff hook rev must
  # match the ruff version pyproject resolves, or the hook and `just check`
  # disagree about what passes, so review a ruff bump against both.
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    # Wait before proposing a bump. Without this, Dependabot opens a pull request
    # the moment a version is published, including one published from a
    # compromised maintainer account. A week is usually long enough for a
    # malicious release to be yanked before it ever reaches a branch here.
    cooldown:
      default-days: 7
      semver-major-days: 30
    commit-message:
      prefix: "build"
      include: scope

  # The actions used by .github/workflows/skill.yml.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait before proposing a bump. Without this, Dependabot opens a pull request
    # the moment a version is published, including one published from a
    # compromised maintainer account. A week is usually long enough for a
    # malicious release to be yanked before it ever reaches a branch here.
    cooldown:
      default-days: 7
      semver-major-days: 30
    commit-message:
      prefix: "ci"
