name: CodeQL

# Static security scanning for Python.
#
# PREREQUISITE: enable Code Scanning in repo Settings → Code security
# (needs a public repo, or GitHub Advanced Security on private repos — NOT
# included in GitHub Pro). Until then this will error, so it does NOT run on
# pull_request and won't gate merges. Once enabled, the weekly schedule +
# manual dispatch cover it; add the push/pull_request triggers back if wanted.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # weekly Monday 06:00 UTC

jobs:
  analyze:
    name: Analyze (Python)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read   # codeql-action needs this to read the workflow run
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
      - uses: github/codeql-action/analyze@v3
