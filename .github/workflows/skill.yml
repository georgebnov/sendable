# The gate for the Sendable skill. Exactly what `just check` runs locally, so a
# green local run means a green run here.
#
# Actions are pinned to a commit hash, not a tag, because a tag can be moved to
# point at different code. The trailing comment is the human-readable version, and
# Dependabot reads it to propose a bump.

name: Skill

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"

# Read-only. Nothing here publishes, comments, or writes to the repository, so the
# default token permissions are more than it needs.
permissions:
  contents: read

concurrency:
  group: skill-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: lint, types, tests (py${{ matrix.python }})
    # GitHub-hosted. Standard hosted runners are free for public repositories,
    # so this costs nothing and every job gets a disposable machine.
    #
    # This ran on a self-hosted runner while the repository was private and its
    # hosted-minute quota was spent. A self-hosted runner cannot stay once the
    # repository is public: the `pull_request` trigger below would let any fork
    # run its own code on that machine, which GitHub documents as the one thing
    # not to do with a self-hosted runner.
    runs-on: ubuntu-latest
    # A hung job here burns minutes rather than a machine someone is using, but
    # it still should not run for 6 hours.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor the project declares, and the code depends on it:
        # StrEnum and typing.NotRequired both arrived in 3.11. 3.14 is what a user
        # with a current uv will resolve to.
        python: ["3.11", "3.14"]
    steps:
      # persist-credentials: false keeps the checkout token out of .git/config,
      # where a later step or a cached artifact could pick it up.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Sync the environment
        run: uv sync --python ${{ matrix.python }}

      - name: Lint
        run: uv run --python ${{ matrix.python }} ruff check .

      - name: Format
        run: uv run --python ${{ matrix.python }} ruff format --check .

      - name: Types
        run: uv run --python ${{ matrix.python }} mypy

      # No network: the suite must be deterministic. The engine reads no
      # environment variable at all, so there is nothing to unset here.
      - name: Tests
        run: |
          # The floor lives in the justfile, which owns it. Reading it here keeps
          # CI and `just check` from drifting apart, which they already did once.
          floor="$(sed -n 's/^coverage_floor := "\([0-9]*\)"/\1/p' justfile)"
          uv run --python ${{ matrix.python }} pytest -q --cov --cov-report=term \
            --cov-fail-under="${floor:-80}"

  packaged-script:
    name: the script a user actually runs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      # This job never runs `uv sync`. It proves the published entry point works
      # from a bare checkout with no project environment, which is how someone who
      # downloads the skill invokes it. The gate job cannot catch a dependency
      # missing from a PEP 723 header, because `uv sync` installs the dev group.
      #
      # The job runs outside the checkout so nothing in the repo is on the path.
      # $RUNNER_TEMP rather than /tmp: the runner owns it and empties it around
      # every job, which holds whether or not the machine is disposable.
      - name: Make a bare working directory
        run: |
          bare="$RUNNER_TEMP/bare"
          mkdir -p "$bare"
          echo "BARE=$bare" >> "$GITHUB_ENV"

      - name: Audit an email with no project environment
        run: |
          cp tests/fixtures/clean_bulk.eml "$BARE/mail.eml"
          cd "$BARE"
          uv run --quiet "$GITHUB_WORKSPACE/scripts/audit.py" mail.eml --offline > report.json
          python - <<'PY'
          import json
          r = json.load(open("report.json"))
          assert 0 <= r["score"] <= 100, r["score"]
          assert r["verdict"] in {"GO", "REVIEW", "NO_GO"}, r["verdict"]
          assert r["findings"], "no findings means the fan-out did not run"
          print(f'ok: score={r["score"]} verdict={r["verdict"]} findings={len(r["findings"])}')
          PY

      # An audit must leave the directory exactly as it found it, beyond the
      # report the step above redirected itself. The store used to write here.
      - name: Confirm the audit wrote nothing of its own
        run: |
          cd "$BARE"
          found="$(ls -A | grep -v '^mail.eml$' | grep -v '^report.json$' || true)"
          if [ -n "$found" ]; then
            echo "the audit created: $found" >&2
            exit 1
          fi
          echo "ok: nothing written"

      # dmarc.py is the other entry point, so a dependency missing from its
      # header alone would otherwise ship. It needs no network to fail: a file
      # that is not a report exits 1 before any DNS read.
      - name: Drive the DMARC entry point
        run: |
          cd "$BARE"
          uv run --quiet "$GITHUB_WORKSPACE/scripts/dmarc.py" --help > /dev/null
          echo '<html>not a report</html>' > junk.xml
          if uv run --quiet "$GITHUB_WORKSPACE/scripts/dmarc.py" junk.xml; then
            echo "expected a non-zero exit for a file that is not a DMARC report" >&2
            exit 1
          fi
          echo "ok: a non-report exits non-zero"
