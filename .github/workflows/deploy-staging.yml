name: Ship to Staging

# TEMPLATE — manual-trigger only for now so it never auto-fails before AWS is
# wired. Once ECR + App Runner exist and the secrets below are set, change the
# trigger to `push: branches: [main]` to deploy on merge.
#
# Required repo secrets:
#   AWS_DEPLOY_ROLE_ARN   IAM role to assume (OIDC) with ECR push + App Runner deploy
#   ECR_REPOSITORY        e.g. 1234567890.dkr.ecr.ca-central-1.amazonaws.com/email-audit-web
#   APP_RUNNER_SERVICE_ARN  the web service ARN to redeploy
on:
  workflow_dispatch:

permissions:
  id-token: write   # OIDC
  contents: read

env:
  AWS_REGION: ca-central-1

jobs:
  deploy:
    name: "🚧 Deploy: Staging"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build + push image
        run: |
          IMAGE="${{ secrets.ECR_REPOSITORY }}:${GITHUB_SHA::8}"
          docker build -t "$IMAGE" production/backend
          docker push "$IMAGE"

      - name: Trigger App Runner deploy
        run: |
          aws apprunner start-deployment \
            --service-arn "${{ secrets.APP_RUNNER_SERVICE_ARN }}" \
            --region "${{ env.AWS_REGION }}"
